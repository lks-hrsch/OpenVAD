[tool.uv.workspace]
members = ["training", "inferencing/openvad", "inferencing/openvad-rs"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Workspace-root sources apply to every member.
[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["pytest", "ruff", "basedpyright"]
# Rule-based lexicons for languages with an acoustic model and no lexicon (dataset/lexicon.py); not a default group.
align = ["epitran"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["training/src", "training/tests/support", "inferencing/openvad/src", "inferencing/openvad-rs/python"]
extend-exclude = ["docs", "tools"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "NPY", # NumPy-specific rules
    "I", # isort - import sorting
    "SIM", # flake8-simplify
    "N", # pep8-naming
    "RUF", # Ruff-specific rules
    "PT", # flake8-pytest-style
    "C4", # flake8-comprehensions
]

[tool.ruff.lint.isort]
# Configure import sorting behavior
force-single-line = false
lines-after-imports = 2

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = ["tools", "**/node_modules", "**/__pycache__", "**/.*"]
extraPaths = ["training/tests/support"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# Test files mirror the implementation tree and keep its file names.
python_files = ["*.py"]
pythonpath = ["training/tests/support"]
testpaths = [
    "training/tests",
    "inferencing/openvad/tests",
    "inferencing/openvad-rs/tests",
]
