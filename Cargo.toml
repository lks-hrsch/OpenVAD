[workspace]
members = ["inferencing/openvad-core", "inferencing/openvad-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Lukas Hirsch"]
license = "MPL-2.0"
publish = false

[workspace.dependencies]
numpy = "0.30.0"
pyo3 = "0.30.1"
safetensors = "0.8.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
