[workspace]
members = ["inferencing/vadigo-core", "inferencing/vadigo-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Lukas Hirsch"]
publish = false

[workspace.dependencies]
pyo3 = "0.30.1"
safetensors = "0.8.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
