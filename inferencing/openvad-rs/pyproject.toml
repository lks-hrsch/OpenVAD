[project]
name = "openvad-rs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "MPL-2.0"
dependencies = ["numpy"]

[dependency-groups]
dev = ["safetensors", "scipy"]

[build-system]
requires = ["maturin>=1.12.6,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "openvad_rs._native"
python-source = "python"

# Rebuild when the bindings or the engine they wrap change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../openvad-core/Cargo.toml" },
    { file = "../openvad-core/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../rust-toolchain.toml" },
]
