[default]
# Mozilla Data Collective dataset IDs (cuid strings), as in fetch/commonvoice.py.
extend-ignore-re = ["\"cm[0-9a-z]{23}\""]

[default.extend-words]
# Creative Commons NoDerivatives, as in CC BY-ND.
ND = "ND"
nd = "nd"
# Bashkir (Common Voice locale) and Bosnia (FLEURS `bs_ba`).
ba = "ba"
# NumPy's `np.arange`.
arange = "arange"
# NumPy's `ndarray.flags.writeable`.
writeable = "writeable"
# The PyPI package certifi, a dependency of requests (docs/notes/forced-alignment.md).
certifi = "certifi"
# RWCP room code in the file names of OpenSLR 28 (fetch/rirs.py).
ane = "ane"
