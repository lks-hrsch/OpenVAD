[project]
name = "openvad-train"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "MPL-2.0"
dependencies = ["numpy", "safetensors", "polars", "soundfile", "scipy", "datasets", "openvad-rs"]

[tool.uv.sources]
openvad-rs = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
